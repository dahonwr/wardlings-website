<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Wardlings — Tiny Guardians of the Sanctuary</title>

    <!-- Favicon: real Wardlings logo. -->
    <link rel="icon" type="image/png" href="/assets/Logo.png" />
    <link rel="apple-touch-icon" href="/assets/Logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DynaPuff:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Patrick+Hand&display=swap" rel="stylesheet">
    <!-- Preconnect + preload the hero background so it's requested
         immediately on first paint (priority loading) and, since it's
         painted via CSS background-image on a persistent element that
         never unmounts, it is only ever fetched once for the whole
         session — it will not "reload" when scrolling back up. -->
    <link rel="preconnect" href="https://osyvztzqmtimbefklcsn.supabase.co" crossorigin>
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/assets/hero-pc.jpg"
      media="(min-width: 1024px)"
    />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/assets/hero-mobile.jpg"
      media="(max-width: 1023px)"
    />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/assets/Logo.png"
    />
  </head>
  <body class="bg-[#FFF9EF] text-[#2B2B2B] antialiased selection:bg-[#F7BFD5] selection:text-[#2B2B2B]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
